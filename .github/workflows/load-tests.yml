name: Load Tests

on:
  workflow_dispatch:
    inputs:
      include_outbound:
        description: Run opt-in partner-bound scenarios and WireMock assertions
        required: false
        default: true
        type: boolean
      run_k6:
        description: Also run the k6 load test suite
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: "10.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  load-tests:
    name: NBomber Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Test/Orders.Integrations.Hub.LoadTests/Orders.Integrations.Hub.LoadTests.csproj

      - name: Run load test
        env:
          LOADTEST_WEBHOOK_COPIES: 20
          LOADTEST_WEBHOOK_DURATION: 00:02:00
          LOADTEST_WEBHOOK_BURST_RATE: 200
          LOADTEST_WEBHOOK_BURST_INTERVAL: 00:00:01
          LOADTEST_WEBHOOK_BURST_DURATION: 00:00:30
          LOADTEST_CORE_COPIES: 50
          LOADTEST_CORE_DURATION: 00:05:00
          LOADTEST_OUTBOUND_COPIES: 10
          LOADTEST_OUTBOUND_DURATION: 00:02:00
        run: |
          if [ "${{ inputs.include_outbound || 'true' }}" = "true" ]; then
            dotnet run --project Test/Orders.Integrations.Hub.LoadTests/Orders.Integrations.Hub.LoadTests.csproj --configuration Release -- --include-outbound
          else
            dotnet run --project Test/Orders.Integrations.Hub.LoadTests/Orders.Integrations.Hub.LoadTests.csproj --configuration Release
          fi

      - name: Upload NBomber reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nbomber-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  k6-load-tests:
    name: k6 Load Test
    if: ${{ github.event_name == 'schedule' || inputs.run_k6 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Restore
        run: dotnet restore Test/Orders.Integrations.Hub.LoadTests/Orders.Integrations.Hub.LoadTests.csproj

      - name: Run k6
        env:
          WEBHOOK_VUS: 3
          WEBHOOK_DURATION: 30s
          CORE_VUS: 3
          CORE_DURATION: 30s
          MAX_ERROR_RATE: 5
          MAX_P95_MS: 5000
        run: bash Test/Orders.Integrations.Hub.LoadTests.K6/scripts/run.sh

      - name: Upload k6 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-reports
          path: reports/k6-*
          if-no-files-found: warn
          retention-days: 14
