name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  COVERAGE_THRESHOLD: 70

jobs:

  build:
    name: Build Test Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Orders.Integrations.Hub.slnx

      - name: Build
        run: |
          dotnet build Orders.Integrations.Hub.slnx \
            --configuration Release \
            --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-build
          path: |
            Src/**/bin/Release/**
            Src/**/obj/Release/**
            Test/**/bin/Release/**
            Test/**/obj/Release/**
          retention-days: 1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: test-build

      - name: Run Unit Tests
        run: |
          dotnet test \
            --project Test/Orders.Integrations.Hub.UnitTests/Orders.Integrations.Hub.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --report-xunit-trx \
            --report-xunit-trx-filename TestResults/unit-tests.trx \
            --coverlet \
            --coverlet-output-format cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
          
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: "**/coverage.cobertura.xml"
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: test-build

      - name: Run Integration Tests
        run: |
          dotnet test \
            --project Test/Orders.Integrations.Hub.IntegrationTests/Orders.Integrations.Hub.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --report-xunit-trx \
            --report-xunit-trx-filename TestResults/integration-tests.trx \
            --coverlet \
            --coverlet-output-format cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: "**/coverage.cobertura.xml"
          if-no-files-found: warn
          retention-days: 14

  architecture-tests:
    name: Architecture Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: test-build

      - name: Run Architecture Tests
        run: |
          dotnet test --project Test/Orders.Integrations.Hub.ArchTests/Orders.Integrations.Hub.ArchTests.csproj \
            --configuration Release \
            --no-build \
            --report-xunit-trx \
            --report-xunit-trx-filename TestResults/architecture-tests.trx
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: 
      - unit-tests
      - integration-tests
    if: needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success'

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install ReportGenerator
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Download unit coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-unit
          path: coverage-input/unit

      - name: Download integration coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-integration
          path: coverage-input/integration
      
      - name: Generate coverage report
        run: |
          reports=$(find coverage-input -name 'coverage.cobertura.xml' -print | paste -sd ';' -)

          if [ -z "$reports" ]; then
            echo "❌ No coverage data available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          reportgenerator \
            "-reports:$reports" \
            "-targetdir:coverage-html" \
            "-reporttypes:Html;MarkdownSummaryGithub;Cobertura" \
            "-assemblyfilters:+Orders.Integrations.Hub*"

      - name: Enforce coverage threshold
        run: |
          python3 <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          threshold = float(os.environ["COVERAGE_THRESHOLD"])

          root = ET.parse("coverage-html/Cobertura.xml").getroot()

          coverage = float(root.attrib["line-rate"]) * 100

          print(f"Coverage: {coverage:.2f}%")
          print(f"Required: {threshold:.2f}%")

          if coverage < threshold:
              print(
                  f"❌ Coverage {coverage:.2f}% is below "
                  f"the required {threshold:.2f}%."
              )
              sys.exit(1)

          print(
              f"✅ Coverage {coverage:.2f}% meets "
              f"the required {threshold:.2f}%."
          )
          PY
      
      - name: Publish coverage summary
        run: |
          cat coverage-html/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage-html
          retention-days: 14
